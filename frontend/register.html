<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CTF - Vol 404 | Inscription</title>
	<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
	<div class="auth-card">
		<div class="auth-logo">âœˆï¸</div>
		<h1 class="auth-title">Vol 404 â€” CTF</h1>
		<p class="auth-subtitle">CrÃ©ez votre compte Ã©tudiant</p>

		<form id="register-form" class="auth-form" autocomplete="off">
			<div class="form-group">
				<label for="username">Identifiant</label>
				<input type="text" id="username" placeholder="ex : Tyler" autocomplete="username" required>
			</div>
			<div class="form-group">
				<label for="password">Mot de passe</label>
				<input type="password" id="password" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" autocomplete="new-password" required>
			</div>
			<div class="form-group">
				<label for="password-confirm">Confirmer le mot de passe</label>
				<input type="password" id="password-confirm" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" autocomplete="new-password" required>
			</div>
			<button type="submit" class="auth-btn">CrÃ©er mon compte</button>
		</form>

		<p class="auth-error" id="error-message"></p>
		<p class="auth-footer-note">DÃ©jÃ  inscrit ? <a href="/etudiant_login.html">Se connecter</a></p>
	</div>

	<script>
		window.addEventListener('DOMContentLoaded', () => {
			requestAnimationFrame(() => requestAnimationFrame(() => {
				document.body.classList.add('page-ready');
			}));
		});

		document.getElementById('register-form').addEventListener('submit', async (e) => {
			e.preventDefault();
			const username = document.getElementById('username').value.trim();
			const password = document.getElementById('password').value;
			const confirmPassword = document.getElementById('password-confirm').value;
			const errorMsg = document.getElementById('error-message');
			errorMsg.textContent = '';

			if (password !== confirmPassword) {
				errorMsg.textContent = 'Les mots de passe ne correspondent pas.';
				return;
			}

			try {
				const res = await fetch('/auth/register', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ username, password })
				});
				const data = await res.json();
				if (res.ok) { window.location.href = '/etudiant_login.html'; return; }
				errorMsg.textContent = data.message || 'Inscription impossible.';
			} catch {
				errorMsg.textContent = 'Erreur de connexion au serveur.';
			}
		});
	</script>

	<footer class="app-footer">
		<p>&copy; 2026 Vol404 CTF â€” Designed by <strong>Yarno Chedemail</strong></p>
	</footer>
</body>
</html>
