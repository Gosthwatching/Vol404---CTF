<!-- Page flag: debloquage par token puis soumission du code. -->
<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CTF - Vol 404 | Flag</title>
	<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="flag-page-body">
	<main class="flag-page">
		<section class="flag-card">
			<h1 class="flag-title">Zone Flag</h1>
			<p class="flag-subtitle">Validez la reponse finale.</p>
		</section>

		<section id="flag-section" class="flag-card">
			<h2 class="flag-subtitle-title">Validation Finale</h2>
			<p class="flag-subtitle">Entrez la reponse finale deduite a partir des indices obtenus au gate.</p>

			<div class="flag-row">
				<input id="flag-code" type="number" placeholder="Code final" class="flag-input flag-input-code" />
				<button id="btn-submit-flag" type="button" class="flag-button flag-button-warning">Valider le code</button>
			</div>
			<pre id="flag-result" class="flag-result"></pre>
		</section>
	</main>

	<script src="assets/JS/flag.js"></script>

	<footer class="app-footer">
		<p>&copy; 2026 Vol404 CTF - Designed by <strong>Yarno Chedemail</strong></p>
	</footer>
</body>
</html>
