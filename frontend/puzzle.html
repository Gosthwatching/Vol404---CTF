<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF - Vol 404 | Puzzle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/JS/puzzle.js" defer></script>
</head>
<body class="puzzle-page-body">
    <main class="puzzle-page">
        <section class="puzzle-card">
            <h1 class="puzzle-title">Zone Puzzle</h1>
            <p class="puzzle-subtitle">Résolvez le puzzle pour valider la fin du CTF</p>
        </section>
        <section>
            <h2 class="puzzle-subtitle-title">Cliquer sur les éléments pour interagir</h2>
            <p class="puzzle-subtitle">Attention : il y a des pièges cachés !</p>
            <p id="puzzle-counter" class="puzzle-counter">Pièces correctes : 0/15</p>
            <div id="puzzle-message" class="puzzle-message" aria-live="polite"></div>
            <div id="puzzle-container" class="puzzle-container mt-2">
                <!-- Le puzzle sera généré ici par JavaScript -->
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <footer class="app-footer">
        <p>&copy; 2026 Vol404 CTF - Designed by <strong>Yarno Chedemail</strong></p>
    </footer>
</body>
</html>
